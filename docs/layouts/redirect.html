{{- /* /docs/ has no content of its own: send it to the quick start, which is the sidebar's first entry. */ -}}
{{- $target := "docs/quick-start/" | absURL -}}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ .Title }}</title>
  <link rel="canonical" href="{{ $target }}">
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0; url={{ $target }}">
</head>
<body><a href="{{ $target }}">Quick start</a></body>
</html>
