version: "2"
run:
  go: 1.26.5
  # Analyze the build-tagged test tiers (tests/integration, tests/e2e) too, so
  # `golangci-lint run ./...` in CI lints them rather than skipping them.
  build-tags:
    - integration
    - e2e
linters:
  enable:
    - asasalint
    # - forbidigo # disabled until we can resolve lints
    - bodyclose
    - contextcheck
    - cyclop
    - depguard
    - dupword
    - errname
    - errorlint
    - exhaustive
    - godot
    # - godox # disabled until we can resolve lints
    - gosec
    - loggercheck
    - misspell
    - nestif
    - nolintlint
    - perfsprint
    - prealloc
    - predeclared
    - revive
    - testifylint
    - unconvert
    - usestdlibvars
    # - wrapcheck # disabled until we can resolve lints
    - wsl_v5
  settings:
    depguard:
      rules:
        main:
          list-mode: lax
          allow:
            - ://github.com
        # Config resolution is the one place that reconciles flags, environment and file, so
        # viper stays behind it. Reading it from a command would reintroduce the precedence
        # bugs the single owner exists to prevent. Mirrors the dr CLI's own rule.
        no-raw-viper:
          list-mode: lax
          files:
            - "!**/internal/config/**"
          deny:
            - pkg: github.com/spf13/viper
              desc: use internal/config, which owns flag/env/file precedence
    errcheck:
      check-blank: true
    staticcheck:
      checks: [ "all", "-ST1005"]
    govet:
      enable:
        - nilness
        - reflectvaluecompare
        - sortslice
        - unusedwrite
        - defers
        - atomic
        - nilfunc
        - printf
        - sortslice
        - tests
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
    rules:
      # Test scaffolding earns different rules than production code. A fake HTTP router is a
      # wide switch by nature and splitting it would obscure what it stands in for, and a
      # fixture walking its own t.TempDir() is not a symlink-traversal risk.
      - path: _test\.go
        linters:
          - cyclop
          - gosec
formatters:
  enable:
    - gofumpt
  exclusions:
    generated: lax
    paths:
      - tmp$
