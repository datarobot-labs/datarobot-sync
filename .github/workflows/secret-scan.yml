---
name: secret-scan
on:
  push:
    branches: ["main", "master"]
  pull_request:
permissions:
  contents: read
jobs:
  gitleaks:
    name: "gitleaks"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      # The gitleaks CLI image instead of gitleaks/gitleaks-action, which needs
      # a license key in an organization. Scans the full history. gitleaks exits
      # 0 after scanning zero commits when git cannot read the repository, so
      # the step also requires a non-zero commit count.
      - name: Scan the history
        run: |
          out=$(docker run --rm --user "$(id -u):$(id -g)" --volume "$PWD:/repo:ro" \
            --env GIT_CONFIG_COUNT=1 --env GIT_CONFIG_KEY_0=safe.directory --env GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --no-banner --no-color --redact 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          echo "$out" | grep -Eq '(^|[^0-9])[1-9][0-9]* commits scanned'
